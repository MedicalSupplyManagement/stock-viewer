<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>คงคลัง & ล็อตยา</title>
<style>
:root{--pri:#0f766e;--ok:#15803d;--warn:#b45309;--bad:#c0262d;--mut:#64748b;--line:#e3e8ef;--bg:#f4f6f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#0f172a;font-family:-apple-system,"Sarabun","Noto Sans Thai","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header h1{margin:0;font-size:17px;font-weight:700}
.sub{font-size:11.5px;opacity:.9;margin-top:2px}
.upd{margin-top:8px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
#cloudstat{font-size:12px;line-height:1.35;flex:1 1 150px;min-width:0}
#cloudstat.new{background:#fff3cd;color:#664d03;border-radius:8px;padding:4px 8px;font-weight:700}
#cloudstat.ok{opacity:.95}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-w{background:#fff;color:var(--pri)}
.btn-p{background:var(--pri);color:#fff}
.btn:disabled{opacity:.55}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--hh,84px);z-index:4}
nav button{flex:1;border:0;background:none;padding:11px 4px;font-size:14px;font-family:inherit;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{padding:10px 12px calc(env(safe-area-inset-bottom) + 24px);max-width:760px;margin:0 auto}
.msg{margin:10px 0;padding:10px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap}
.msg.err{background:#fdecec;color:#8a1c1c;border:1px solid #f3b8b8}
.msg.info{background:#e7f5ef;color:#14532d;border:1px solid #b8e0cb}
input[type=search],input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:84px}
.chip b{display:block;font-size:16px}
.chip span{font-size:10.5px;color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.sw{position:relative}
.sw input{padding-right:40px}
.clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;line-height:1;color:var(--mut);padding:8px 11px;cursor:pointer}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.tgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tg{border:1.5px solid var(--bad);background:#fff;color:var(--bad);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}
.tg.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tg.inact{border-color:var(--pri);color:var(--pri)}
.tg.inact.on{color:#fff}
.card.dc{--ac:var(--pri);padding:0;overflow:hidden;border:1px solid #d5dee8;border-left:6px solid var(--ac);box-shadow:0 3px 10px rgba(15,23,42,.12);margin:0 0 14px}
.dc .dh{padding:11px 12px 9px;background:#f1f5f7;background:color-mix(in srgb,var(--ac) 9%,#fff);border-bottom:1px solid #dbe3ea;border-bottom-color:color-mix(in srgb,var(--ac) 25%,#fff)}
.dc .db{padding:10px 12px}
.dc .nm{font-weight:700;font-size:15.5px;color:#0b3c49}
.dc .big{font-size:21px;font-weight:800;color:#0b3c49}
.dc.ok{--ac:var(--ok)}.dc.warn{--ac:var(--warn)}.dc.bad{--ac:var(--bad)}.dc.none{--ac:#64748b}.dc.po{--ac:#2563a8}
.gd h3{margin:0 0 6px;font-size:15px;color:var(--pri)}
.gd ol,.gd ul{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.65}
.gd p{margin:6px 0 0;font-size:13.5px;line-height:1.65}
.gd .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gd .tip{margin-top:8px;background:#e7f5ef;border:1px solid #b8e0cb;color:#14532d;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.55}
.nm{font-weight:600;font-size:15px}
.meta{font-size:11px;color:var(--mut);margin-top:1px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;margin-top:4px}
.pill.y{border-color:#b8e0cb;color:var(--ok);background:#effaf4}
.pill.n{border-color:#f3b8b8;color:var(--bad);background:#fdf1f1}
.row{display:flex;gap:10px;margin-top:8px}
.row>div{flex:1;min-width:0}
.lb{font-size:10.5px;color:var(--mut)}
.big{font-size:20px;font-weight:700}
.val{font-weight:700;font-size:14px}
.exp{margin-top:8px;border-radius:11px;padding:8px 11px;font-size:12.5px;font-weight:600;border:1px solid}
.exp.ok{color:var(--ok);background:#15803d14;border-color:#15803d70}
.exp.warn{color:var(--warn);background:#b4530914;border-color:#b4530970}
.exp.bad{color:#fff;background:var(--bad);border-color:var(--bad)}
.exp.none{color:var(--mut);background:#64748b10;border-color:#64748b50}
details summary{cursor:pointer;font-weight:700;font-size:13px;padding:8px 2px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
.lot{border-top:1px solid var(--line);padding:9px 4px;display:flex;justify-content:space-between;gap:8px}
.lot .ln{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12.5px}
.lot .r{text-align:right}
.rem-w{font-size:11.5px;color:var(--mut);margin-top:3px}
.rem-w.w{font-weight:700}
.empty{text-align:center;color:var(--mut);padding:40px 10px;white-space:pre-wrap}
.flag{float:right;background:var(--pri);color:#fff;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.mono{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13.5px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.more{width:100%;margin:4px 0 10px}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.btn-o{background:#fff;color:var(--pri);border:1px solid var(--pri);padding:6px 12px;font-size:13px;margin-top:8px}
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#ov[hidden]{display:none}
.ovh{position:sticky;top:0;z-index:2;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.ovh .btn{padding:7px 12px}
.ovh .t{font-weight:700;font-size:15px;line-height:1.3;min-width:0}
.ovb{padding:10px 12px calc(env(safe-area-inset-bottom) + 28px);max-width:760px;margin:0 auto}
.kv{display:flex;gap:8px;padding:4px 0;font-size:13.5px}
.kv .k{flex:0 0 104px;font-size:12px;color:var(--mut)}
.kv .v{flex:1;min-width:0;font-weight:600;word-break:break-word}
.h2{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--pri);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--pri);padding:5px 11px;font-size:12.5px;font-weight:700;font-family:inherit}
.seg button.on{background:var(--pri);color:#fff}
.dr{display:flex;gap:6px;padding:5px 0;font-size:13px;border-top:1px solid var(--line)}
.dr:first-of-type{border-top:0}
.dr>div:nth-child(1){flex:4}.dr>div:nth-child(2),.dr>div:nth-child(3){flex:3;text-align:right}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.dt{border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.dt th,table.dt td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line)}
table.dt th:first-child,table.dt td:first-child{text-align:left;position:sticky;left:0;background:#fff}
table.dt th{font-size:12px;background:#f8fafc}
table.dt tr.tot td{font-weight:700;background:#f8fafc}
.fld{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-weight:600;font-family:inherit;background:#fff;color:#0b3c49}
.frow{display:flex;gap:8px;margin-top:8px}
.frow>div{flex:1;min-width:0}
.frow label{margin:0 0 3px 2px;font-size:11px}
.frow+.frow{margin-top:6px}
.leg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:10.5px;color:var(--mut)}
.leg i{font-style:normal;color:#222;border-radius:6px;padding:1px 7px}
.mo0{background:#bde8cc}.mo1{background:#fff1a8}.mo2{background:#ffd6a5}.mo3{background:#e1e4e8}
.mono.mo{display:inline-block;border-radius:6px;padding:2px 8px;color:#0b3c49}
.grp{font-weight:800;font-size:14px;color:#0b3c49;margin:14px 2px 6px}
.grp.sub{font-size:13px;color:var(--pri);margin:8px 2px 6px}
.dc.pend{--ac:var(--warn)}
.dc .bad{color:var(--bad)}
.dep{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 10px;margin-top:6px}
.dep label{display:flex;align-items:center;gap:8px;margin:0;padding:7px 0;font-size:13.5px;color:#0b3c49}
.dep input{width:auto}
.pk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:11px;color:var(--mut)}
.pk .pill{margin-top:0}
</style>
</head>
<body>
<header id="hd">
  <h1>คงคลัง &amp; ล็อตยา</h1>
  <div class="sub" id="asof">ยังไม่มีข้อมูลในเครื่อง</div>
  <div class="upd"><button class="btn btn-w" id="btnUpd">อัปเดตจากคลาวด์</button><span class="sub" id="busy"></span><div id="cloudstat" class="sub"></div></div>
</header>
<nav id="nav">
  <button data-t="lots" class="on">คงคลัง</button>
  <button data-t="po">ใบสั่งซื้อ</button>
  <button data-t="pend">ค้างจ่ายยา</button>
  <button data-t="help">วิธีใช้</button>
  <button data-t="set">ตั้งค่า</button>
</nav>
<main>
  <div id="msg"></div>
  <section id="t-lots"></section>
  <section id="t-po" hidden></section>
  <section id="t-pend" hidden></section>
  <section id="t-help" hidden></section>
  <section id="t-set" hidden></section>
</main>
<div id="ov" hidden></div>

<script>
"use strict";
/* ===================== ที่เก็บข้อมูลในเครื่อง ===================== */
var CFG_KEY = "stockviewer.cfg.v1";
var DEFAULT_CFG = {owner:"MedicalSupplyManagement", repo:"stock-snapshot", branch:"main", path:"data/snapshot.json", token:""};
var cfg = loadCfg();
var fromLink = applyLinkConfig();
var snap = null;              // {fetched_at, po[], lots[], warehouses{}}
var drugs = [], drugsNoExp = null;
var localMeta = null;         // {sha,date} ของชุดข้อมูลบนคลาวด์ที่ดึงมาเก็บไว้ในเครื่อง
var cloudHead = null;         // {sha,date} ชุดล่าสุดบนคลาวด์ (ตรวจล่าสุด) หรือ {none:true} / {error:true}
var view = {lots:{term:"",limit:60,showExpired:true,showInactive:false,sort:"name"}, po:{term:"",limit:60,sort:"poNo",type:"1"},
            pend:{term:"",limit:60,from:null,to:null,wh:0,deps:[]}};

function loadCfg(){
  var c = Object.assign({}, DEFAULT_CFG);
  try{ var j = JSON.parse(localStorage.getItem(CFG_KEY)||"{}");
    ["owner","repo","branch","path","token"].forEach(function(k){ if(typeof j[k]==="string" && j[k].trim()) c[k]=j[k].trim(); });
  }catch(e){}
  return c;
}
/* ลิงก์ตั้งค่า: https://.../stock-viewer/#t=โทเคน  (ส่วนหลัง # ไม่ถูกส่งไปที่เซิร์ฟเวอร์) */
function applyLinkConfig(){
  try{
    var h=(location.hash||"").replace(/^#/,""); if(!h) return false;
    var p={}; h.split("&").forEach(function(kv){ var i=kv.indexOf("="); if(i>0) p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); });
    var tok=p.t||p.token; if(!tok) return false;
    cfg.token=tok.trim();
    ["owner","repo","branch","path"].forEach(function(k){ if(p[k]) cfg[k]=p[k].trim(); });
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }   // เอาโทเคนออกจากแถบที่อยู่
    return true;
  }catch(e){ return false; }
}
function saveCfg(){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  try{ kvSet("cfg",Object.assign({},cfg)).catch(function(){}); }catch(e){}   // สำรองอีกที่ เผื่อ localStorage ถูกล้าง
}

var DB_NAME="stockviewer", STORE="kv";
function idb(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error("no idb")); return; }
    var r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = function(){ r.result.createObjectStore(STORE); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function kvGet(k){ return idb().then(function(db){ return new Promise(function(res,rej){
  var q = db.transaction(STORE,"readonly").objectStore(STORE).get(k);
  q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);}; }); }); }
function kvSet(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){
  var tx = db.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(v,k);
  tx.oncomplete=function(){res();}; tx.onerror=function(){rej(tx.error);}; tx.onabort=function(){rej(tx.error);}; }); }); }

/* ===================== ฟังก์ชันช่วย ===================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function num(v){ if(v==null) return 0; var n=Number(v); return isNaN(n)?0:n; }
function str(v){ if(v==null) return null; var s=String(v); return s===""?null:s; }
function fmtNum(v,dec){
  if(v==null) return "—"; if(dec==null) dec=2;
  var s = Number(v).toFixed(dec);
  if(s.indexOf(".")>=0) s = s.replace(/0+$/,"").replace(/\.$/,"");
  var neg = s[0]==="-"; if(neg) s=s.slice(1);
  var p = s.split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"-":"")+p.join(".");
}
function fmtDate(iso){
  if(!iso||iso.length<10) return "—";
  var p = iso.slice(0,10).split("-"); if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];      // ค.ศ. เหมือนแอป
}
function fmtDT(d){
  var t=new Date(d); if(isNaN(t)) return "—";
  function z(n){return (n<10?"0":"")+n;}
  return z(t.getDate())+"/"+z(t.getMonth()+1)+"/"+t.getFullYear()+" "+z(t.getHours())+":"+z(t.getMinutes());
}
function parseDay(iso){
  if(!iso||iso.length<10) return null;
  var p=iso.slice(0,10).split("-"); var y=+p[0],m=+p[1],d=+p[2];
  if(!y||!m||!d) return null; return Date.UTC(y,m-1,d);
}
function todayUTC(){ var n=new Date(); return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); }
function daysTo(iso){ var e=parseDay(iso); if(e==null) return null; return Math.round((e-todayUTC())/86400000); }
function remainOf(iso){
  var e=parseDay(iso);
  if(e==null) return {text:"ไม่ระบุวันหมดอายุ",level:"none",days:null};
  var days=Math.round((e-todayUTC())/86400000);
  if(days<0) return {text:"หมดอายุแล้ว "+(-days)+" วัน",level:"bad",days:days};
  if(days===0) return {text:"หมดอายุวันนี้",level:"bad",days:0};
  var t=new Date(todayUTC()), x=new Date(e);
  var y=x.getUTCFullYear()-t.getUTCFullYear(), m=x.getUTCMonth()-t.getUTCMonth(), d=x.getUTCDate()-t.getUTCDate();
  if(d<0){ m--; d+=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),0)).getUTCDate(); }
  if(m<0){ y--; m+=12; }
  var parts=[]; if(y>0) parts.push(y+" ปี"); if(m>0) parts.push(m+" เดือน"); if(d>0||!parts.length) parts.push(d+" วัน");
  return {text:"อีก "+parts.join(" ")+" ("+days+" วัน)", level: days<=90?"bad":(days<=180?"warn":"ok"), days:days};
}
function packText(qty,size,packUnit,unit){
  if(!(size>1)) return {main:(fmtNum(qty)+" "+(unit||"")).trim(), sub:""};
  var packs=Math.floor(qty/size), rem=qty-packs*size;
  var main=fmtNum(packs,0)+" "+(packUnit||"แพ็ค"); if(rem>0) main+=" + "+fmtNum(rem);
  return {main:main, sub:(fmtNum(qty)+" "+(unit||"")+" (× "+fmtNum(size)+")").trim()};
}

/* ===================== จัดกลุ่ม 1 ยา = 1 การ์ด ===================== */
function buildDrugs(rows){
  var map={}, order=[];
  rows.forEach(function(r){
    var id=num(r.item_id);
    var d=map[id];
    if(!d){ d=map[id]={itemId:id,itemName:str(r.item_name)||"",unit:str(r.unit),totalQty:0,lotCount:0,nearest:null,
                       useStatus:null,packUnit:str(r.unit),packSize:1,lots:[]}; order.push(d); }
    if(!d.useStatus) d.useStatus=str(r.use_status);
    var q=num(r.qty); d.totalQty+=q;
    if(q<=0) return;                        // ยาคงเหลือ 0: โชว์ชื่อยา ไม่นับเป็นล็อต
    var ps=num(r.pack_size);
    d.lots.push({lotNo:str(r.lot_no),expire:str(r.expire_date),qty:q,wh:num(r.warehouse_id),
                 packUnit:str(r.pack_unit),packSize:ps<=0?1:ps});
    var e=str(r.expire_date);
    if(e && (d.nearest==null || e<d.nearest)) d.nearest=e;
  });
  order.forEach(function(d){
    d.lots.sort(function(a,b){ return (a.expire||"9999-12-31")<(b.expire||"9999-12-31")?-1:((a.expire||"9999-12-31")>(b.expire||"9999-12-31")?1:0); });
    var seen={}; d.lots.forEach(function(l){ seen[l.lotNo+"|"+l.wh]=1; }); d.lotCount=Object.keys(seen).length;
    var big=null; d.lots.forEach(function(l){ if(l.packSize>1 && (!big||l.qty>big.qty)) big=l; });
    if(big){ d.packUnit=big.packUnit; d.packSize=big.packSize; }
  });
  order.sort(function(a,b){ var x=a.nearest||"9999-12-31", y=b.nearest||"9999-12-31"; return x<y?-1:(x>y?1:0); });
  return order;
}

/* ===================== แสดงผล ===================== */
function whName(id){ return (snap&&snap.warehouses&&snap.warehouses[id])||("คลัง "+id); }
function $(id){ return document.getElementById(id); }

function chipsHtml(items){
  return '<div class="chips">'+items.map(function(c){return '<div class="chip"><b>'+esc(c[1])+'</b><span>'+esc(c[0])+'</span></div>';}).join("")+'</div>';
}
function noData(){ return '<div class="empty">ยังไม่มีข้อมูลในเครื่อง\nกด "อัปเดตจากคลาวด์" ด้านบน</div>'; }

/* ค้นหาแบบ live: จำตำแหน่งหน้าจอก่อนเริ่มพิมพ์ แล้วเลื่อนกลับเมื่อลบคำค้นจนว่าง */
function searchChange(v,st,rerender){
  v=v.trim();
  if(!st.term && v){ st.savedY=window.pageYOffset; st.savedLimit=st.limit; }
  var cleared=!!st.term && !v;
  st.term=v; st.limit=60;
  if(cleared) st.limit=Math.max(60,st.savedLimit||60);
  rerender();
  if(cleared){ var y=st.savedY||0; requestAnimationFrame(function(){ window.scrollTo(0,y); requestAnimationFrame(function(){ window.scrollTo(0,y); }); }); }
}
function getDrugsNoExp(){

function thCmp(a,b){ return String(a).localeCompare(String(b),"th"); }
var LOT_SORTS=[["name","ชื่อยา (ก-ฮ / A-Z)"],["expDesc","วันหมดอายุ มาก → น้อย"],["expAsc","วันหมดอายุ น้อย → มาก"],
               ["priceDesc","ราคาซื้อล่าสุด มาก → น้อย"],["priceAsc","ราคาซื้อล่าสุด น้อย → มาก"]];
function lotPrice(d){ var i=infoMap[d.itemId]; return (i&&i.po_price!=null)?num(i.po_price):null; }
function sortDrugs(rows,mode){
  var idx=new Map(); rows.forEach(function(d,i){ idx.set(d,i); });
  var nul=function(x,y){ return (x==null?1:0)-(y==null?1:0); };   // ไม่มีค่า อยู่ท้ายเสมอ
  var out=rows.slice();
  out.sort(function(a,b){
    var c=0;
    if(mode==="name") c=thCmp(a.itemName,b.itemName);
    else if(mode==="expDesc"||mode==="expAsc"){
      if(a.nearest==null||b.nearest==null) c=nul(a.nearest,b.nearest);
      else c=(mode==="expDesc"?-1:1)*(a.nearest<b.nearest?-1:(a.nearest>b.nearest?1:0));
      if(!c) c=thCmp(a.itemName,b.itemName);
    } else {
      var pa=lotPrice(a), pb=lotPrice(b);
      if(pa==null||pb==null) c=nul(pa,pb); else c=(mode==="priceDesc"?-1:1)*(pa-pb);
      if(!c) c=thCmp(a.itemName,b.itemName);
    }
    return c||(idx.get(a)-idx.get(b));
  });
  return out;
}

   '<div class="hint">โทเคนจะถูกเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ใช้อ่านไฟล์ข้อมูลอย่างเดียว</div>'+
   '<div style="margin-top:12px"><button class="btn btn-p" id="c-save">บันทึกการตั้งค่า</button></div></div>'+
   '<div class="card"><div class="nm">ลิงก์ตั้งค่าให้เพื่อนร่วมงาน</div><div class="hint">'+
   'ถ้าโทเคนหายหรือเปลี่ยนเครื่อง แตะลิงก์นี้ครั้งเดียวก็ตั้งค่าให้เอง ไม่ต้องพิมพ์โทเคน (ส่วนโทเคนอยู่หลังเครื่องหมาย # จึงไม่ถูกส่งไปที่เซิร์ฟเวอร์ และจะถูกเอาออกจากแถบที่อยู่ทันทีหลังเปิด) '+
   '<b>ลิงก์นี้มีโทเคนอยู่ข้างใน ส่งให้เฉพาะคนในหน่วยงาน และใช้กับโทเคนอ่านอย่างเดียวเท่านั้น</b></div>'+
   '<div style="margin-top:12px"><button class="btn btn-p" id="c-link">คัดลอกลิงก์ตั้งค่า</button></div></div>'+
   '<div class="card"><div class="nm">เกี่ยวกับข้อมูล</div><div class="hint">'+
   'ข้อมูลทั้งหมดมาจากสำเนาที่ผู้ดูแลส่งขึ้นคลาวด์ กด "อัปเดตจากคลาวด์" เพื่อดึงชุดล่าสุดมาเก็บในเครื่อง หลังจากนั้นเปิดดูได้โดยไม่ต้องมีอินเทอร์เน็ต '+
   'ถ้าอัปเดตไม่สำเร็จ ข้อมูลเดิมในเครื่องจะยังอยู่ครบ'+
   '<br>ปุ่ม "ข้อมูลยา" ในแต่ละการ์ดแสดงข้อมูลทั่วไป ยอดเบิก 4 เดือน และยอดจ่ายผู้ป่วย 12 เดือน (ยอดจ่ายขึ้นกับว่าผู้ดูแลอัปเดตจาก HOSxP แล้วส่งขึ้นคลาวด์หรือยัง)'+
   '<br>ข้อมูลล่าสุดในเครื่อง: <b>'+(snap?esc(fmtDT(snap.fetched_at)):"ยังไม่มี")+'</b></div></div>';
  $("c-link").onclick=function(){
    if(!cfg.token){ showMsg("err","ยังไม่มีโทเคนในเครื่องนี้ วางโทเคนแล้วกดบันทึกก่อน"); return; }
    var u=location.origin+location.pathname+"#t="+encodeURIComponent(cfg.token);
    function done(){ showMsg("info","คัดลอกลิงก์แล้ว ส่งให้เฉพาะคนในหน่วยงาน (ลิงก์มีโทเคนอยู่ข้างใน)"); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(done,function(){ window.prompt("คัดลอกลิงก์นี้",u); }); }
    else { window.prompt("คัดลอกลิงก์นี้",u); }
  };
  $("c-save").onclick=function(){
    ["owner","repo","branch","path","token"].forEach(function(k){ var v=$("c-"+k).value.trim(); cfg[k]=v||(DEFAULT_CFG[k]); if(k==="token") cfg.token=v; });
    saveCfg(); showMsg("info","บันทึกการตั้งค่าแล้ว"); checkCloud().then(fixHeader);
  };
}

function showMsg(kind,text){ $("msg").innerHTML = text? '<div class="msg '+kind+'">'+esc(text)+'</div>':""; }
function renderAsOf(){
  $("asof").textContent = snap ? ("ข้อมูล ณ "+fmtDT(snap.fetched_at)+" · "+drugs.length+" รายการยา · "+(snap.po||[]).length+" แถว PO"+(snap.disp_fetched_at?(" · ยอดจ่าย ณ "+fmtDT(snap.disp_fetched_at)):"")) : "ยังไม่มีข้อมูลในเครื่อง";
}
function setSnap(s){
  snap=s; drugs=buildDrugs(s.lots||[]); drugsNoExp=null; buildIndex(s);
  renderAsOf(); renderLots(); renderPo(); renderPend(); renderSet();
}

/* ===================== อัปเดตจากคลาวด์ ===================== */
function b64utf8(s){ return atob(s.replace(/\s/g,"")); }
function ghBase(){ return "https://api.github.com/repos/"+encodeURIComponent(cfg.owner)+"/"+encodeURIComponent(cfg.repo); }
function ghPath(){ return cfg.path.split("/").filter(Boolean).map(encodeURIComponent).join("/"); }
function ghHeaders(accept){
  var h={"Accept":accept,"X-GitHub-Api-Version":"2022-11-28"};
  if(cfg.token) h["Authorization"]="Bearer "+cfg.token;
  return h;
}
/* ถามคลาวด์ว่า "ส่งชุดข้อมูลล่าสุดเมื่อไหร่" (เบามาก ไม่โหลดไฟล์ข้อมูล) */
function fetchHead(){
  var url=ghBase()+"/commits?path="+ghPath()+"&sha="+encodeURIComponent(cfg.branch||"main")+"&per_page=1";
  return fetch(url,{headers:ghHeaders("application/vnd.github+json"),cache:"no-store"}).then(function(r){
    if(r.status===404) return {none:true};
    if(r.status===401||r.status===403) return {error:true,why:"โทเคนใช้ไม่ได้ (รหัส "+r.status+")"};
    if(!r.ok) return {error:true,why:"คลาวด์ตอบกลับผิดปกติ (รหัส "+r.status+")"};
    return r.json().then(function(a){
      if(!Array.isArray(a)||!a.length) return {none:true};
      var c=a[0], cm=c.commit||{}, dt=(cm.committer&&cm.committer.date)||(cm.author&&cm.author.date)||null;
      return {sha:c.sha, date:dt};
    });
  });
}
function renderCloudStat(){
  var el=$("cloudstat"); if(!el) return;
  var h=cloudHead, cls="sub", t="";
  if(!cfg.owner||!cfg.repo||!cfg.path){ t=""; }
  else if(h==="checking"){ t="กำลังตรวจชุดข้อมูลบนคลาวด์…"; }
  else if(!h){ t=""; }
  else if(h.none){ t="ยังไม่มีข้อมูลบนคลาวด์ (หรือโทเคนยังไม่มีสิทธิ์ใน repo)"; }
  else if(h.error){ t="ตรวจคลาวด์ไม่ได้: "+h.why; }
  else {
    var when=h.date?fmtDT(h.date):"ไม่ทราบเวลา";
    if(!snap){ cls="sub new"; t="มีชุดข้อมูลบนคลาวด์ (ส่งเมื่อ "+when+") กดอัปเดตได้เลย"; }
    else if(localMeta && localMeta.sha===h.sha){ cls="sub ok"; t="✓ ข้อมูลในเครื่องเป็นชุดล่าสุดแล้ว (คลาวด์ส่งเมื่อ "+when+")"; }
    else if(localMeta){ cls="sub new"; t="มีชุดข้อมูลใหม่บนคลาวด์ (ส่งเมื่อ "+when+") กด “อัปเดตจากคลาวด์”"; }
    else { cls="sub"; t="ชุดล่าสุดบนคลาวด์ส่งเมื่อ "+when+" (ยังเทียบกับในเครื่องไม่ได้ กดอัปเดตเพื่อให้แน่ใจ)"; }
  }
  el.className=cls; el.textContent=t;
}
function checkCloud(){
  if(!cfg.owner||!cfg.repo||!cfg.path){ cloudHead=null; renderCloudStat(); return Promise.resolve(); }
  if(window.__checking) return Promise.resolve();
  window.__checking=true; cloudHead="checking"; renderCloudStat();
  return fetchHead().then(function(h){ cloudHead=h; },function(e){
    cloudHead={error:true,why:(navigator.onLine===false?"ไม่มีอินเทอร์เน็ต":"เชื่อมต่อไม่ได้")};
  }).then(function(){ window.__checking=false; renderCloudStat(); });
}

function updateFromCloud(){
  if(!cfg.owner||!cfg.repo||!cfg.path){ showMsg("err","ยังไม่ได้ตั้งค่าคลาวด์ (แท็บ ตั้งค่า)"); return; }
  var btn=$("btnUpd"); btn.disabled=true; $("busy").textContent="กำลังดึงข้อมูล…"; showMsg("","");
  var head=null;
  // 1) ถามว่าชุดล่าสุดคือชุดไหน (ถ้าถามไม่ได้ ก็ดึงตาม branch ต่อไป) 2) ดึงไฟล์ตามชุดนั้นให้ตรงกัน
  fetchHead().catch(function(){ return null; }).then(function(h){
    if(h && h.sha) head=h;
    var ref=(head&&head.sha)?head.sha:(cfg.branch||"main");
    var url=ghBase()+"/contents/"+ghPath()+"?ref="+encodeURIComponent(ref);
    return fetch(url,{headers:ghHeaders("application/vnd.github.raw+json"),cache:"no-store"});
  }).then(function(r){
    if(r.status===401||r.status===403) throw new Error("เข้าถึงไม่ได้ (รหัส "+r.status+") ตรวจโทเคนว่าถูกต้องและยังไม่หมดอายุ");
    if(r.status===404) throw new Error("ไม่พบไฟล์ข้อมูลบนคลาวด์ (404) ตรวจ owner/repo/path หรือผู้ดูแลยังไม่ได้ส่งข้อมูลขึ้น หรือโทเคนไม่มีสิทธิ์ repo นี้");
    if(!r.ok) throw new Error("คลาวด์ตอบกลับผิดปกติ (รหัส "+r.status+")");
    return r.text();
  }).then(function(txt){
    var j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("ไฟล์บนคลาวด์ไม่ใช่ข้อมูลที่แอปอ่านได้"); }
    if(j && j.encoding==="base64" && j.content){ try{ j=JSON.parse(decodeURIComponent(escape(b64utf8(j.content)))); }catch(e){ throw new Error("ถอดรหัสไฟล์ไม่สำเร็จ"); } }
    if(!j || !Array.isArray(j.lots) || !Array.isArray(j.po) || !j.fetched_at) throw new Error("รูปแบบข้อมูลไม่ถูกต้อง (ไม่มี lots / po / fetched_at)");
    var meta = head ? {sha:head.sha,date:head.date} : null;
    return kvSet("snapshot",j).then(function(){ return kvSet("meta",meta); }).then(function(){ return j; },function(){ return j; }).then(function(x){ localMeta=meta; return x; });
  }).then(function(j){
    setSnap(j);
    if(head){ cloudHead=head; } renderCloudStat(); fixHeader();
    showMsg("info","อัปเดตจากคลาวด์แล้ว · ข้อมูล ณ "+fmtDT(j.fetched_at));
  }).catch(function(e){
    var m=(e&&e.message)||String(e);
    if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m="เชื่อมต่อคลาวด์ไม่ได้ (ไม่มีอินเทอร์เน็ต หรือเบราว์เซอร์/ที่โฮสต์หน้านี้บล็อกการเชื่อมต่อ)";
    showMsg("err","อัปเดตไม่สำเร็จ: "+m+(snap?"\nข้อมูลเดิมในเครื่องยังอยู่ครบ":""));
  }).then(function(){ btn.disabled=false; $("busy").textContent=""; });
}

/* ===================== แท็บ / เริ่มต้น ===================== */
$("t-help").innerHTML=HELP_HTML;
function showTab(t){
  ["lots","po","pend","help","set"].forEach(function(k){ $("t-"+k).hidden = (k!==t); });
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){ b.classList.toggle("on", b.getAttribute("data-t")===t); });
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){ b.onclick=function(){ showTab(b.getAttribute("data-t")); }; });
$("btnUpd").onclick=updateFromCloud;
function fixHeader(){ document.documentElement.style.setProperty("--hh",$("hd").offsetHeight+"px"); }
window.addEventListener("resize",fixHeader);

try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
renderLots(); renderPo(); renderPend(); renderSet(); fixHeader();
if(fromLink){ saveCfg(); showMsg("info","ตั้งค่าโทเคนจากลิงก์แล้ว กด “อัปเดตจากคลาวด์” ได้เลย"); }
kvGet("cfg").then(function(c){
  if(c && !cfg.token && typeof c.token==="string" && c.token){   // localStorage โดนล้าง แต่ยังมีสำรองอยู่
    ["owner","repo","branch","path","token"].forEach(function(k){ if(typeof c[k]==="string" && c[k]) cfg[k]=c[k]; });
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
    renderSet(); checkCloud().then(fixHeader);
  }
}).catch(function(){});
kvGet("snapshot").then(function(j){ if(j && Array.isArray(j.lots)){ setSnap(j); } })
  .catch(function(){})
  .then(function(){ return kvGet("meta").then(function(m){ if(m && m.sha) localMeta=m; },function(){}); })
  .then(function(){ renderCloudStat(); fixHeader(); return checkCloud(); })
  .then(fixHeader);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkCloud().then(fixHeader); });
window.addEventListener("online",function(){ checkCloud().then(fixHeader); });
</script>
